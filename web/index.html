<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="دليل الشركات والعملاء - CorpHub">

  <!-- ربط ملف الـ Manifest لتفعيل التثبيت (Install) -->
  <link rel="manifest" href="manifest.json">

  <!-- لوجو الأيقونة فوق في المتصفح -->
  <link rel="icon" type="image/jpeg" href="https://www.eglegypt.com/wp-content/uploads/2022/05/EGL-Logo-2022-1536x708.jpg.webp">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CorpHub">
  <link rel="apple-touch-icon" href="https://www.eglegypt.com/wp-content/uploads/2022/05/EGL-Logo-2022-1536x708.jpg.webp">

  <title>دليل الشركات - CorpHub</title>

  <!-- سكريبت الحماية: منع Inspect و F12 مع السماح بالنسخ -->
  <script>
    document.addEventListener('contextmenu', function (e) {
      if (window.getSelection().toString().length > 0) {
        return true;
      }
      e.preventDefault();
    });

    document.addEventListener('keydown', function (e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
